<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital Bank of Australia</title>
<link rel="preload" as="image" href="assets/capital-building.webp" type="image/webp">
<link rel="prefetch" href="main/index.html">
<noscript><meta http-equiv="refresh" content="15;url=main/index.html"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0b2b1c; --forest-deep:#06170e;
  --gold:#c9a227; --gold-soft:#dcc47a; --ivory:#f3ecd8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--forest-deep);color:var(--ivory);font-family:'Jost',system-ui,sans-serif;overflow:hidden}

/* Site shown after loading (placeholder) */
.site{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--forest)}
.site h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(1.8rem,5vw,3.4rem);letter-spacing:.03em}
.site p{margin-top:12px;font-weight:300;letter-spacing:.14em;color:var(--gold-soft)}
.site button{margin-top:32px;background:none;border:1px solid var(--gold);color:var(--gold-soft);padding:11px 26px;font:inherit;font-size:.85rem;letter-spacing:.14em;cursor:pointer}
.site button:hover,.site button:focus-visible{background:var(--gold);color:var(--forest-deep);outline:none}

/* Preloader: the building is the container, everything sits on it from the first frame */
.preloader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  background:var(--forest-deep);--bld:url(assets/capital-building.webp);overflow:hidden;
  transition:opacity .9s ease,visibility .9s}
.preloader.done{opacity:0;visibility:hidden}
.bg{position:absolute;inset:0;background:var(--bld) center 38%/cover no-repeat;animation:kb 15s ease-out forwards}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.preloader::before{content:"";z-index:1;position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 48%,rgba(6,23,14,0) 25%,rgba(2,10,6,.55) 100%),
    linear-gradient(180deg,rgba(6,23,14,.55) 0%,rgba(6,23,14,.72) 50%,rgba(6,23,14,.88) 100%)}
.frame{z-index:2;position:absolute;inset:clamp(12px,2vw,24px);border:1px solid rgba(201,162,39,.5);pointer-events:none}

:root{--e:clamp(230px,34vmin,360px)}
.stage{z-index:3;position:absolute;inset:0;text-align:center}
.brand{position:absolute;left:0;right:0;top:calc(50% + var(--e)/2 + clamp(18px,3.4vh,34px));display:flex;flex-direction:column;align-items:center;padding:0 24px}

.emblem{position:absolute;left:50%;top:50%;width:var(--e);height:var(--e);transform:translate(-50%,-50%);display:grid;place-items:center}
.ring{position:absolute;inset:0;width:100%;height:100%}
.r-a,.r-b,.r-c,.r-ticks{transform-origin:200px 200px}
.r-a{animation:spin 4.5s linear infinite}
.r-b{animation:spin 7s linear infinite reverse}
.r-c{animation:spin 14s linear infinite}
.r-ticks{animation:spin 60s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{width:100%;height:100%;display:grid;place-items:center}
.logo img{height:65%;max-width:70%;object-fit:contain;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}

.name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;
  font-size:clamp(1.2rem,3.2vmin,1.9rem);letter-spacing:.26em;color:var(--gold);line-height:1.3}
.rule{width:56px;height:1px;background:var(--gold);margin:clamp(14px,2.4vh,22px) 0;opacity:.8}
.motto{--p:0%;position:relative;display:inline-block;font-weight:400;font-size:clamp(.85rem,2vmin,1.05rem);letter-spacing:.14em;padding-bottom:12px;
  background:linear-gradient(90deg,#e9d38a 0,#e9d38a var(--p),rgba(243,236,216,.3) var(--p),rgba(243,236,216,.3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.motto::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,#8f6d17 0,#c9a227 calc(var(--p) - 1%),#fff0b5 var(--p),rgba(220,196,122,.25) var(--p),rgba(220,196,122,.25) 100%)}
.status-line{margin-top:16px;display:flex;gap:18px;justify-content:center;font-size:.72rem;font-weight:300;letter-spacing:.16em;color:var(--gold-soft)}

/* bank name: letter-by-letter typeset transition */
.name .w{display:inline-block;white-space:nowrap}
.name .l{display:inline-block;opacity:0;transform:translateY(.45em);filter:blur(5px);
  animation:lt 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 85ms + 300ms)}
@keyframes lt{to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.name .l{animation-duration:.01s;animation-delay:0s}}

.progress{position:absolute;left:50%;bottom:clamp(34px,7vh,64px);transform:translateX(-50%);width:min(320px,70vw)}
.track{height:1px;background:rgba(220,196,122,.3);position:relative}
.fill{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:.72rem;font-weight:300;letter-spacing:.16em;color:var(--gold-soft)}
#pct{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){.r-a,.r-b,.r-c,.r-ticks{animation-duration:120s}}

/* ===== luxury layer ===== */
#dust{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
.frame::before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,162,39,.2)}
.frame i{position:absolute;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 10px rgba(201,162,39,.6)}
.frame i:nth-child(1){top:-5px;left:-5px}.frame i:nth-child(2){top:-5px;right:-5px}
.frame i:nth-child(3){bottom:-5px;left:-5px}.frame i:nth-child(4){bottom:-5px;right:-5px}

.emblem{animation:emerge 2s cubic-bezier(.2,.7,.2,1) both}
@keyframes emerge{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.halo{position:absolute;inset:-22%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(220,196,122,.28) 0%,rgba(201,162,39,.1) 38%,transparent 66%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07);opacity:.7}}
.rays{position:absolute;inset:-36%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(233,211,138,.10) 0 4deg,transparent 4deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 22%,transparent 66%);mask:radial-gradient(circle,#000 22%,transparent 66%);
  animation:spin 120s linear infinite}
.ripple{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(233,211,138,.7);opacity:0;animation:ripple 5s ease-out 1.5s infinite}
.ripple.b{animation-delay:4s}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.35);opacity:0}}
.r-a{filter:drop-shadow(0 0 5px rgba(240,220,154,.85))}
.ring{overflow:visible}
.ring .dia{fill:#f0dc9a}
.logo{position:absolute;inset:0;display:block}
.shield{position:absolute;left:50%;top:50%;height:56%;aspect-ratio:514/606;transform:translate(-50%,-50%);display:block}
.logo .shield img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;display:block}
.shield::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,244,205,.75) 50%,transparent 58%);background-size:300% 100%;background-position:130% 0;
  -webkit-mask:var(--shield) center/contain no-repeat;mask:var(--shield) center/contain no-repeat;animation:sweep 5.5s ease-in-out 2.2s infinite}
@keyframes sweep{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}

.name .l{animation:glint 6s ease-in-out infinite;
  animation-delay:calc(var(--i) * 70ms + 2s);text-shadow:0 0 14px rgba(201,162,39,.28)}
@keyframes glint{0%,100%{color:var(--gold)}12%{color:#fff1b8}24%{color:var(--gold)}}
.rule{position:relative;width:0;animation:rg 1.6s cubic-bezier(.2,.7,.2,1) 2.6s forwards}
@keyframes rg{to{width:110px}}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 4px var(--forest-deep)}
.motto::before{content:"";position:absolute;left:var(--p);bottom:-2px;width:6px;height:6px;background:#fff6cf;transform:translateX(-50%) rotate(45deg);
  box-shadow:0 0 10px 3px rgba(243,224,160,.85)}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,240,190,.85),rgba(201,162,39,.35) 40%,transparent 70%)}
.preloader.finish .flash{animation:flash 1s ease-out forwards}
@keyframes flash{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.preloader.finish .emblem{animation:none;transform:translate(-50%,-50%) scale(1.04);transition:transform 1s ease}
@media (prefers-reduced-motion:reduce){.halo,.rays,.ripple,.shield::after,.name .l{animation:none}.name .l{opacity:1;transform:none;filter:none}#dust{display:none}}
</style>
</head>

    <div class="brand">
    <h2 class="name" id="name" aria-label="Capital Bank of Australia">CAPITAL BANK OF AUSTRALIA</h2>
    <div class="rule"></div>
    <p class="motto" id="motto">Building wealth. Secure and safe assets.</p>
    <div class="status-line"><span id="status">Initialising secure environment</span><span id="pct">0%</span></div>
    </div>
</div>
</div>

<script>
(function(){
  const t0 = performance.now();
  const DURATION = 15000;
  const TARGET = 'main/index.html';
  const pre = document.getElementById('preloader');
  const motto = document.getElementById('motto');
  const pct = document.getElementById('pct');
  const status = document.getElementById('status');
  const steps = [
    [0,'Initialising secure environment'],[3500,'Verifying encryption'],
    [7000,'Authenticating connection'],[10500,'Loading your portfolio'],[14000,'Welcome']
  ];
  // split bank name into words and letters for the staggered transition
  const nameEl = document.getElementById('name'); let n = 0;
  const words = nameEl.textContent.trim().split(' ');
  nameEl.textContent = '';
  words.forEach((w, wi) => {
    const ws = document.createElement('span'); ws.className = 'w'; ws.setAttribute('aria-hidden','true');
    [...w].forEach(ch => { const s = document.createElement('span'); s.className = 'l'; s.textContent = ch; s.style.setProperty('--i', n++); ws.appendChild(s); });
    nameEl.appendChild(ws); if (wi < words.length - 1) { nameEl.appendChild(document.createTextNode(' ')); n += 2; }
  });
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  // name transition pattern: in -> hold -> out -> in (centre-out) -> out -> in (right to left, stays)
  const letters = [...nameEl.querySelectorAll('.l')], N = letters.length;
  const rank = {
    ltr: i => i,
    rtl: i => N - 1 - i,
    centre: i => Math.abs(i - (N - 1) / 2) * 2
  };
  const EASE = 'cubic-bezier(.2,.7,.2,1)';
  const hidden = {opacity: 0, transform: 'translateY(.45em)', filter: 'blur(5px)'};
  const shown = {opacity: 1, transform: 'none', filter: 'blur(0px)'};
  function run(kind, dir){
    letters.forEach((el, i) => {
      const r = rank[kind](i);
      if(dir === 'in') el.animate([hidden, shown], {duration: 900, delay: r * 70, easing: EASE, fill: 'forwards'});
      else el.animate([shown, hidden], {duration: 700, delay: r * 40, easing: 'ease-in', fill: 'forwards'});
    });
  }
  if(still){ letters.forEach(el => el.style.opacity = 1); }
  else {
    [[300,'ltr','in'],[5200,'rtl','out'],[6400,'centre','in'],[10200,'centre','out'],[11300,'rtl','in']]
      .forEach(([ms, k, d]) => setTimeout(() => run(k, d), ms));
  }
  const sh = document.querySelector('.shield img');
  pre.style.setProperty('--shield', 'url("' + sh.src + '")');
  // fine gold dust
  const cv = document.getElementById('dust'), cx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  let W, H, ps = [];
  function fit(){ W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    ps = Array.from({length: 38}, () => ({x: Math.random()*W, y: Math.random()*H, r: (Math.random()*1.2+.5)*dpr, v: (Math.random()*.18+.06)*dpr, a: Math.random()*6.28, s: Math.random()*.012+.004})); }
  fit(); addEventListener('resize', fit);
  let dustOn = !still;
  (function dust(){
    if(!dustOn) return;
    cx.clearRect(0,0,W,H);
    for(const q of ps){ q.y -= q.v; q.a += q.s; q.x += Math.sin(q.a)*.2*dpr; if(q.y < -4){ q.y = H+4; q.x = Math.random()*W; }
      cx.beginPath(); cx.fillStyle = 'rgba(240,222,160,' + (.15 + .4*Math.abs(Math.sin(q.a))) + ')'; cx.arc(q.x, q.y, q.r, 0, 6.3); cx.fill(); }
    requestAnimationFrame(dust);
  })();
  let idx = -1;
  function tick(now){
    const el = now - t0, t = Math.min(Math.max(el, 0) / DURATION, 1);
    motto.style.setProperty('--p', (t * 100).toFixed(2) + '%');
    pct.textContent = Math.round(t * 100) + '%';
    for(let i = steps.length - 1; i >= 0; i--){
      if(el >= steps[i][0]){ if(idx !== i){ idx = i; status.textContent = steps[i][1]; } break; }
    }
    if(t < 1) requestAnimationFrame(tick);
    else { pct.textContent = '100%'; }
  }
  requestAnimationFrame(tick);
  // gold flash just before the end, then open main.html at exactly 15 seconds
  setTimeout(() => pre.classList.add('finish'), DURATION - 800);
  setTimeout(() => location.replace(TARGET), Math.max(0, DURATION - (performance.now() - t0)));
})();
</script>
